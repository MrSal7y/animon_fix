plugins {
    id "fabric-loom" version "1.12.7"
    // Cobblemon uses Kotlin reflection; Loom must remap its Kotlin metadata in dev runs.
    id "org.jetbrains.kotlin.jvm" version "2.2.20"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    splitEnvironmentSourceSets()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Match Cobblemon's local-variable names used by its sound mixins in dev runs.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "maven.modrinth:cobblemon:${project.cobblemon_fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    // Loom's dev classpath needs the libraries nested inside Cobblemon's release jar.
    runtimeOnly "org.graalvm.js:js:22.3.0"
    runtimeOnly "org.mongodb:mongodb-driver-sync:4.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testImplementation "org.ow2.asm:asm-tree:9.7.1"
    testImplementation sourceSets.client.output
    testImplementation files(sourceSets.client.compileClasspath)
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
